name: Build lyrics fix APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyrics-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test lyrics
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest -PmcLyricTestsOnly=true
      - name: Build APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PmcVersionName=0.9.45-Plus -PmcVersionCode=945004
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/HyperMusicCover-0.9.45-Plus.apk
          cd dist
          sha256sum HyperMusicCover-0.9.45-Plus.apk > SHA256SUMS.txt
      - name: Verify Xposed entry points
        run: |
          unzip -p dist/HyperMusicCover-0.9.45-Plus.apk META-INF/xposed/java_init.list | grep -qx 'com.os4.musiccover.Main'
          unzip -p dist/HyperMusicCover-0.9.45-Plus.apk META-INF/xposed/scope.list | grep -qx 'com.android.systemui'
      - uses: actions/upload-artifact@v4
        with:
          name: HyperMusicCover-0.9.45-Plus
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyric-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
